# This workflow will test a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

# Nearly everything this builds lives under server/ -- including the .proto
# files, which `make -C proto` copies into server/src/main/protobuf. The
# exceptions are client/rsh/src, whose headers the server's tests compile the
# generated C against (plus the fir2c runtime sources they compile into it, so
# the result loads without the `rsh` package), and the vendored GNU-R those
# tests run and link against (the `R` gitlink plus the script that builds it).
# The two `paths` lists must be kept in sync; GitHub Actions does not support
# YAML anchors.
on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - "client/rsh/src/**"
      # Only the gitlink is tracked for the submodule, so this is a plain path
      # rather than an `R/**` glob, which would never match.
      - "R"
      - "tools/build-gnur.sh"
      - ".github/workflows/maven.yml"
      - ".github/actions/setup-gnur/**"
  pull_request:
    branches: ["main"]
    paths:
      - "server/**"
      - "client/rsh/src/**"
      - "R"
      - "tools/build-gnur.sh"
      - ".github/workflows/maven.yml"
      - ".github/actions/setup-gnur/**"
  workflow_dispatch:

# Skip the `stdlib_*` examples in the snapshot tests: they're slow and cover the
# same code paths as the smaller examples. `TestConfig` picks this up from the
# environment, which the forked Surefire JVMs inherit.
env:
  EXAMPLE_FILTER: "(?!stdlib_).*"

# All the jobs run `./mvnw` rather than the runner's `mvn`: the build needs
# Maven 4 (maven-compiler-plugin 4.x), while the runner images still ship Maven
# 3.9, which bails out before it gets as far as the build.
#
# They all also need the patched GNU-R at `R/`
jobs:
  gnur-linux:
    name: GNU-R (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Build and cache GNU-R
        uses: ./.github/actions/setup-gnur
        with:
          build: "true"

  gnur-macos:
    name: GNU-R (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
      - name: Build and cache GNU-R
        uses: ./.github/actions/setup-gnur
        with:
          build: "true"

  artifact:
    runs-on: ubuntu-latest
    needs: gnur-linux

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: "26"
          distribution: "temurin"
          cache: maven
      - name: Set up GNU-R
        uses: ./.github/actions/setup-gnur
      - name: Build artifact
        working-directory: server
        run: ./mvnw --batch-mode --update-snapshots package
      - name: Upload snapshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: server/target/*-SNAPSHOT.jar
      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
        with:
          directory: ${{ github.workspace }}/server

  test:
    runs-on: ubuntu-latest
    needs: gnur-linux

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: "26"
          distribution: "temurin"
          cache: maven
      - name: Set up GNU-R
        uses: ./.github/actions/setup-gnur
      - name: Run tests (no static analyses)
        working-directory: server
        run: ./mvnw --batch-mode --update-snapshots test

  verify:
    runs-on: ubuntu-latest
    needs: gnur-linux

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: "26"
          distribution: "temurin"
          cache: maven
      - name: Set up GNU-R
        uses: ./.github/actions/setup-gnur
      - name: Run tests and static analyses
        working-directory: server
        run: ./mvnw --batch-mode --update-snapshots verify

  verify-macos:
    runs-on: macos-latest
    needs: gnur-macos

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: "26"
          distribution: "temurin"
          cache: maven
      - name: Set up GNU-R
        uses: ./.github/actions/setup-gnur
      - name: Run tests and static analyses
        working-directory: server
        run: ./mvnw --batch-mode --update-snapshots verify
