# This workflow will test a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

# Nearly everything this builds lives under server/ -- including the .proto
# files, which `make -C proto` copies into server/src/main/protobuf. The
# exception is client/rsh/src, whose headers the server's tests compile the
# generated C against. The two `paths` lists must be kept in sync; GitHub
# Actions does not support YAML anchors.
on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - "client/rsh/src/**"
  pull_request:
    branches: ["main"]
    paths:
      - "server/**"
      - "client/rsh/src/**"
  workflow_dispatch:

jobs:
  artifact:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: "22"
          distribution: "temurin"
          cache: maven
      - name: Set up GNU-R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"
      - name: Build artifact
        working-directory: server
        run: mvn --batch-mode --update-snapshots package
      - name: Upload snapshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: server/target/*-SNAPSHOT.jar
      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
        with:
          directory: ${{ github.workspace }}/server

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: "22"
          distribution: "temurin"
          cache: maven
      - name: Set up GNU-R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"
      - name: Run tests (no static analyses)
        working-directory: server
        run: mvn --batch-mode --update-snapshots test

  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: "22"
          distribution: "temurin"
          cache: maven
      - name: Set up GNU-R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"
      - name: Run tests and static analyses
        working-directory: server
        run: mvn --batch-mode --update-snapshots verify

  verify-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: "22"
          distribution: "temurin"
          cache: maven
      - name: Set up GNU-R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"
      - name: Run tests and static analyses
        working-directory: server
        run: mvn --batch-mode --update-snapshots verify
